<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0b">
<title>Lucy: runs</title>
<style>
 /* the control page's colours (view.html); the list itself is styled by runs.js */
 :root { --bg:#0a0a0b; --card:#151619; --card2:#1e2025; --line:#2b2e35; --text:#f4f3ee; --mute:#8e919a;
         --y:#ffd23f; --teal:#2ec4b6; --coral:#ff5a5f; --sky:#6cb8ff; }
 * { box-sizing:border-box; }
 body { background:var(--bg); color:var(--text); font:15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin:0; }
 header { display:flex; align-items:center; gap:12px; padding:12px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); }
 .logo { font-weight:900; letter-spacing:.3em; color:var(--y); text-decoration:none; }
 h1 { font-size:13px; text-transform:uppercase; letter-spacing:.12em; color:var(--y); margin:0; font-weight:800; }
 main { max-width:760px; margin:0 auto; padding:12px; }
 .note { color:var(--mute); font-size:13px; }
 button { font:inherit; cursor:pointer; border:0; border-radius:12px; background:var(--card2); color:var(--text); padding:8px 14px; margin-left:auto; }
</style></head><body>
<header><a class="logo" href="/view">LUCY</a><h1>All runs</h1><button id="refresh">Refresh</button></header>
<main><div class="note" id="note"></div><div id="list"></div></main>
<script src="/runs.js"></script>
<script>
const list = document.getElementById('list'), note = document.getElementById('note');
loadRuns(list, note, null);
document.getElementById('refresh').onclick = () => loadRuns(list, note, null, true);
</script>
</body></html>
